<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUSPECT Mission Control</title><link rel="stylesheet" href="/style.css"></head><body class="teacher"><canvas id="stars"></canvas><main class="dash"><header><div><div class="eyebrow">THE MERIDIAN</div><h1>MISSION CONTROL</h1></div><div id="connection">OFFLINE</div></header><section id="create" class="panel"><h2>Launch a classroom mission</h2><p>No accounts. No tracking. Temporary room data only.</p><button id="createRoom" class="primary">CREATE SECURE ROOM</button></section><section id="control" class="hidden"><div class="codeCard"><small>STUDENT ROOM CODE</small><strong id="bigCode"></strong><span>Open this site on student devices</span></div><div class="grid"><section class="panel"><h2>Crew <span id="count"></span></h2><div id="players" class="roster"></div></section><section class="panel settings"><h2>Mission settings</h2><label>Maximum players<input id="maxPlayers" type="number" min="4" max="20" value="12"></label><label>Impostors<select id="impostors"><option value="">Automatic</option><option>1</option><option>2</option><option>3</option></select></label><label>Tasks each<input id="taskCount" type="number" min="1" max="5" value="3"></label><label>Kill cooldown<input id="killCooldown" type="number" min="5" max="60" value="25"></label><label><input id="devMode" type="checkbox"> Developer mode (start under 4)</label><button id="save">SAVE SETTINGS</button><label class="upload">Question bank JSON<input id="questions" type="file" accept=".json"></label></section></div><div class="toolbar"><button id="start" class="primary">START MISSION</button><button id="pause">PAUSE / RESUME</button><button id="end" class="danger">END ROUND</button><button id="rematch">RETURN TO LOBBY</button></div></section><p id="error" class="error"></p></main><script type="module" src="/teacher.js"></script></body></html>
